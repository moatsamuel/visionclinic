<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | VISION CLINIC</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center px-6 py-10">
    <!-- Register Container -->
    <div class="w-full max-w-lg">
        <!-- Clinic Name -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-indigo-950">
                VISION CLINIC
            </h1>
            <p class="text-slate-500 mt-2">
                Better Health. Better Life.
            </p>
        </div>


        <!-- Register Card -->
        <div class="bg-white rounded-2xl shadow-lg p-8">
            <h2 class="text-2xl font-bold text-slate-800 text-center">
                Create Your Account
            </h2>
            <p class="text-slate-500 text-center mt-2 mb-7">
                Register to access VISION CLINIC
            </p>


            <!-- Register Form -->
            <form>
                <!-- Full Name -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Full Name
                    </label>
                    <input
                        type="text"
                        placeholder="Enter your full name"
                        class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                </div>


                <!-- Email -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Email Address
                    </label>
                    <input
                        type="email"
                        placeholder="Enter your email"
                        class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    > 
                </div>


                <!-- Phone -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Phone Number
                    </label>
                    <input
                        type="tel"
                        placeholder="Enter your phone number"
                        class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                </div>


                <!-- User Type -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Account Type
                    </label>
                    <select
                        class="w-full border border-slate-300 rounded-xl px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                        <option value="">Select account type</option>
                        <option value="patient">Patient</option>
                        <option value="doctor">Doctor</option>
                    </select>
                </div>


                <!-- Password -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Password
                    </label>
                    <input
                        type="password"
                        placeholder="Create a password"
                        class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                </div>


                <!-- Confirm Password -->
                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Confirm Password
                    </label>
                    <input
                        type="password"
                        placeholder="Confirm your password"
                        class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >
                </div>


                <!-- Terms -->
                <div class="flex items-start gap-2 mb-6">
                    <input
                        type="checkbox"
                        class="w-4 h-4 mt-1"
                    >
                    <p class="text-sm text-slate-500">
                        I agree to the VISION CLINIC
                        <a href="#" class="text-indigo-700 font-medium">
                            Terms and Conditions
                        </a>
                    </p>
                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="w-full bg-indigo-950 text-white py-3 rounded-xl font-semibold hover:bg-indigo-900 transition"
                >
                    Create Account
                </button>
            </form>

            <!-- Login Link -->
            <p class="text-center text-sm text-slate-500 mt-6">
                Already have an account?
                <a
                    href="/login"
                    class="text-indigo-700 font-semibold hover:text-indigo-900"
                >
                    Login
                </a>

            </p>

        </div>


        <!-- Back to Home -->
        <div class="text-center mt-6">
            <a
                href="/"
                class="text-sm text-slate-500 hover:text-indigo-700"
            >
                ← Back to Home
            </a>
        </div>

    </div>

</body>
</html>
