<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | VISION CLINIC</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center px-6">

    <!-- Login Container -->
    <div class="w-full max-w-md">

        <!-- Clinic Name -->
        <div class="text-center mb-8">

            <h1 class="text-3xl font-bold text-indigo-950">
                VISION CLINIC
            </h1>

            <p class="text-slate-500 mt-2">
                Better Vision. Better Life.
            </p>

        </div>


        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-lg p-8">

            <h2 class="text-2xl font-bold text-slate-800 text-center">
                Welcome Back
            </h2>

            <p class="text-slate-500 text-center mt-2 mb-7">
                Login to access your clinic account
            </p>


            <!-- Login Form -->
            <form>

                <!-- Email -->
                <div class="mb-5">

                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Email Address
                    </label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >

                </div>


                <!-- Password -->
                <div class="mb-5">

                    <label class="block text-sm font-medium text-slate-700 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        placeholder="Enter your password"
                        class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                    >

                </div>


                <!-- Remember / Forgot -->
                <div class="flex items-center justify-between mb-6">

                    <label class="flex items-center gap-2 text-sm text-slate-600">

                        <input type="checkbox" class="w-4 h-4">

                        Remember me

                    </label>

                    <a href="#" class="text-sm text-indigo-700 hover:text-indigo-900">
                        Forgot Password?
                    </a>

                </div>


                <!-- Login Button -->
                <button type="submit" class="w-full bg-indigo-950 text-white py-3 rounded-xl font-semibold hover:bg-indigo-900 transition">Login</button>

            </form>


            <!-- Register Link -->
            <p class="text-center text-sm text-slate-500 mt-6">
                Don't have an account?

                <a href="register.html" class="text-indigo-700 font-semibold hover:text-indigo-900">
                    Register
                </a>

            </p>

        </div>


        <!-- Back to Home -->
        <div class="text-center mt-6">

            <a href="index.html" class="text-sm text-slate-500 hover:text-indigo-700">
                ← Back to Home
            </a>

        </div>

    </div>

</body>
</html>
